# ps5-pro-watch — retailer registry
# tier/adapter: bestbuy_ca | bestbuy_us | target_us | amazon | sfcc |
#               playstation_direct | json | http | browser
# An `http` target that comes back BLOCKED/UNKNOWN auto-escalates to the browser tier.

settings:
  product_match: ["playstation 5 pro", "ps5 pro"]
  exclude_match: ["cover", "stand", "fan", "bracket", "disc drive", "controller",
                  "charger", "skin", "case", "refurbished", "dualsense", "headset",
                  "faceplate", "cooling", "mount", "warranty", "protection"]
  postal_ca: "M5V3L9"
  target_store_id: "3991"
  browser_concurrency: 3
  stealth_concurrency: 2
  stealth_headless: false     # headless FAILS every hard target -- keep false
  stealth_offscreen: true     # park the window at -3000,-3000: invisible, still stealthy
  stealth_wait_ms: 6000
  tls_warm: true
  browser_wait_ms: 4500
  resolve_pdp: true
  pdp_limit: 2
  http_concurrency: 8
  auto_escalate: true
  headless: true
  price_alert_cad: 1200        # flag US deals cheaper than this once converted
  quiet_statuses: ["OUT_OF_STOCK"]   # excluded from instant alerts, kept in digest

targets:
